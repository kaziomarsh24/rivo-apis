info:
  name: Get Provider KYC Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/admin/providers/{{selectedProviderId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

vars:
  selectedProviderId: 1

docs: |-
  # Admin Service Providers & KYC Moderation - Single Provider Details
  
  Returns comprehensive business registration data, uploaded verification documents (trade licenses, drug licenses, practitioner certificates), applicant owner profile, and operational telemetry.
  
  ### Security
  - **Required Role**: `admin`
  - **Header**: `Authorization: Bearer {{adminToken}}`
  
  ### Path Parameters
  - `selectedProviderId`: The provider primary key ID.
  
  ### Expected Response (`200 OK`)
  ```json
  {
