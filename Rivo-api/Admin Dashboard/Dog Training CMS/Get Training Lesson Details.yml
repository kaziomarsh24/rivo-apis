info:
  name: Get Training Lesson Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/admin/trainings/{{selectedLessonId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

vars:
  selectedLessonId: 1

docs: |-
  # Admin Dog Training CMS - Single Lesson Details
  
  Returns comprehensive lesson instructions, step-by-step visual cues, video URLs, and pet engagement telemetry.
  
  ### Security
  - **Required Role**: `admin`
  - **Header**: `Authorization: Bearer {{adminToken}}`
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "Training lesson details retrieved successfully.",
    "data": {
