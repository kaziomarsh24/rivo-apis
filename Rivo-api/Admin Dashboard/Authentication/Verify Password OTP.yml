info:
  name: Verify Password OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/auth/verify-password-otp"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@rivo.app",
        "otp": "123456"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        try {
            const jsonData = res.getBody();
            if (jsonData && jsonData.data && jsonData.data.reset_token) {
                bru.setVar("adminResetToken", jsonData.data.reset_token);
                console.log("Admin reset token saved to 'adminResetToken'");
            }
        } catch (e) {
            console.error("Failed to parse reset token:", e);
        }

docs: |-
  # Verify Password Reset OTP
  
  Validates the 6-digit one-time password sent to the administrator's email.
  
  ### Request Body
  - `email`: (string, required) Administrator email.
  - `otp`: (numeric, required) 6-digit OTP code received via email.
  
  ### Automatic Script
  - On verification success, stores the temporary `reset_token` into the Bruno variable **`adminResetToken`** for use in the password reset step.
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "OTP verified successfully.",
    "data": {
      "reset_token": "60-char-secure-random-token"
    }
  }
  ```
