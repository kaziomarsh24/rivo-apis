info:
  name: Reset Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/auth/reset-password-with-token"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@rivo.app",
        "reset_token": "{{adminResetToken}}",
        "password": "NewSecurePassword@123",
        "password_confirmation": "NewSecurePassword@123"
      }
  auth: inherit

docs: |-
  # Reset Password with Verified Token
  
  Completes the password recovery cycle by setting a new password using the verified reset token.
  
  ### Request Body
  - `email`: (string, required) Administrator email.
  - `reset_token`: (string, required) Token obtained from `Verify Password OTP`.
  - `password`: (string, required, min 8) New administrator password.
  - `password_confirmation`: (string, required) Must match `password`.
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "Password reset successfully.",
    "data": []
  }
  ```
