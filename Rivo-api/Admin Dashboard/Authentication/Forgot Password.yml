info:
  name: Forgot Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/auth/forgot-password"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@rivo.app"
      }
  auth: inherit

docs: |-
  # Forgot Password Request
  
  Sends a 6-digit verification OTP to the administrator's email for password recovery.
  
  ### Request Body
  - `email`: (string, required) Registered administrator email address (`admin@rivo.app`).
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "OTP sent to your email.",
    "data": []
  }
  ```
