info:
  name: Get Pet Owner Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/admin/users/{{selectedUserId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

vars:
  selectedUserId: 226

docs: |-
  # Admin Pet Owners CRM - Single User Details
  
  Returns comprehensive profile telemetry, owned pets list, streak metrics across activities (walks, care tasks, training), earned badges, and emergency contacts.
  
  ### Security
  - **Required Role**: `admin`
  - **Header**: `Authorization: Bearer {{adminToken}}`
  
  ### Path Parameters
  - `selectedUserId`: The user primary key ID to inspect.
  
  ### Expected Response (`200 OK`)
  ```json
  {
