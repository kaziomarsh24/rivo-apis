info:
  name: Suspend Pet Owner
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/admin/users/{{selectedUserId}}/suspend"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "reason": "Repeated violations of platform safety guidelines and inappropriate content.",
        "admin_note": "Internal note: flagged twice by moderation team before suspension."
      }
  auth: inherit

vars:
  selectedUserId: 226

docs: |-
  # Admin Pet Owners CRM - Suspend User Account
  
  Suspends a user account with a mandatory reason. Immediately terminates all active authentication sessions and bearer tokens (`tokens()->delete()`), preventing the user from accessing the app.
  
  ### Security
  - **Required Role**: `admin`
  - **Header**: `Authorization: Bearer {{adminToken}}`
  
  ### Body Parameters
  - `reason`: (string, required, min: 3, max: 500) The suspension explanation shown to the user if they attempt login.
  - `admin_note`: (string, optional, max: 1000) Internal administrator reference note.
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "User suspended successfully.",
    "data": {
      "id": 226,
      "name": "Sarah Mitchell",
      "email": "sarah.mitchell@example.com",
      "phone_number": "+12025550198",
      "avatar": "http://api.thedreamdividend.com/storage/avatars/user_226.jpg",
      "plan": {
        "id": 2,
        "name": "Rivo Plus",
        "badge": "plus"
      },
      "status": "suspended",
      "is_suspended": true,
      "suspended_at": "2026-11-01T02:45:00.000000Z",
      "suspension_reason": "Repeated violations of platform safety guidelines and inappropriate content.",
      "pets_count": 2,
      "total_xp": 380,
      "level": 4,
      "created_at": "2026-10-31T05:06:23.000000Z",
      "joined_formatted": "Oct 31, 2026"
    }
  }
  ```
