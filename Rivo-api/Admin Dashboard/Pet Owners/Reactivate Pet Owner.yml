info:
  name: Reactivate Pet Owner
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/admin/users/{{selectedUserId}}/reactivate"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

vars:
  selectedUserId: 226

docs: |-
  # Admin Pet Owners CRM - Reactivate User Account
  
  Reactivates a previously suspended user account, clearing `suspended_at` and `suspension_reason`. The user is immediately eligible to sign back into the application.
  
  ### Security
  - **Required Role**: `admin`
  - **Header**: `Authorization: Bearer {{adminToken}}`
  
  ### Expected Response (`200 OK`)
  ```json
  {
    "ok": true,
    "message": "User reactivated successfully.",
    "data": {
      "id": 226,
      "name": "Sarah Mitchell",
      "email": "sarah.mitchell@example.com",
      "phone_number": "+12025550198",
      "avatar": "http://api.thedreamdividend.com/storage/avatars/user_226.jpg",
      "plan": {
        "id": 2,
        "name": "Rivo Plus",
        "badge": "plus"
      },
      "status": "active",
      "is_suspended": false,
      "suspended_at": null,
      "suspension_reason": null,
      "pets_count": 2,
      "total_xp": 380,
      "level": 4,
      "created_at": "2026-10-31T05:06:23.000000Z",
      "joined_formatted": "Oct 31, 2026"
    }
  }
  ```
