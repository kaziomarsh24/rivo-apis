info:
  name: Get Vaccination Details
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/vaccinations/1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userSarah}}"

docs: |-
  # Get Pet Vaccination Details API

  Retrieves the full record details for a specific vaccine entry, including batch/lot number, clinic info, and certificate download link.

  ## Figma Screen
  - **Screen:** `Vaccination Detail Card` / `Certificate Modal`

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/pets/:petId/vaccinations/:vaccinationId`
  - **Authentication:** `Bearer {{userSarah}}`

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Vaccination details retrieved successfully",
    "data": {
      "id": 1,
      "pet_id": 1,
      "name": "Rabies Vaccine (3-Year)",
      "vaccine_type": "core",
      "administered_at": "2026-04-30",
      "administered_at_formatted": "30 Apr 2026",
      "due_at": "2027-04-30",
      "due_at_formatted": "30 Apr 2027",
      "days_remaining": 181,
      "status": "up_to_date",
      "status_badge": {
        "status": "up_to_date",
        "label": "Up to Date",
        "color": "#10B981",
        "background_color": "#D1FAE5",
        "icon": "check_circle",
        "description": "Valid and fully protected"
      },
      "clinic_name": "Metropolitan Pet Hospital & Trauma Center",
      "veterinarian_name": "Dr. Emily Watson, DVM",
      "batch_number": "RB-2026-9941",
      "certificate_url": "http://10.10.28.53:80/storage/vaccinations/sample_rabies_cert.pdf",
      "has_certificate": true,
      "notes": "Annual rabies 3-year booster administered subcutaneously right hind leg. No adverse reactions observed."
    }
  }
  ```
