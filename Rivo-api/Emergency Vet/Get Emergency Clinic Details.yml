docs: |-
  # Get Emergency Clinic Details API

  Retrieves detailed profile information, emergency hotline numbers, specialized emergency capabilities, and Google Maps directions for a specific 24/7 veterinary clinic.

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/emergency/clinics/:clinicId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `clinicId` | integer | Yes | Clinic ID (e.g. `2`) |

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `latitude` | float | Optional | User GPS latitude for distance calculation |
  | `longitude` | float | Optional | User GPS longitude for distance calculation |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Emergency clinic details retrieved successfully",
    "data": {
      "id": 2,
      "name": "MedVet Silicon Valley (24-Hour Emergency Hospital)",
      "slug": "medvet-silicon-valley-24-hour",
      "phone_number": "+1 (408) 649-7070",
      "emergency_hotline": "+1 (408) 649-7070",
      "email": "contact.sv@medvet.com",
      "address": {
        "street": "2101 S 10th St",
        "city": "San Jose",
        "state": "CA",
        "zip_code": "95112",
        "formatted": "2101 S 10th St, San Jose, CA 95112"
      },
      "coordinates": {
        "latitude": 37.3142,
        "longitude": -121.8621
      },
      "distance_km": 3.4,
      "distance_formatted": "3.4 km away",
      "is_open_24_7": true,
      "open_hours_text": "Open 24/7 • Trauma Team on Duty",
      "rating": 4.8,
      "reviews_count": 340,
      "services": [
        "24/7 Emergency Response",
        "Trauma Resuscitation",
        "Orthopedic & Soft Tissue Surgery",
        "CT Scan & Rapid Diagnostics",
        "Toxicology & Poison Control",
        "Continuous Inpatient Monitoring"
      ],
      "photo_url": null,
      "website": "https://www.medvet.com/silicon-valley",
      "google_maps_url": "https://www.google.com/maps/dir/?api=1&destination=37.3142,-121.8621",
      "is_verified": true
    }
  }
  ```

  ---

  ## Error Responses
  - **404 Not Found:** Clinic not found.
  - **401 Unauthorized:** Missing or invalid Bearer token.
