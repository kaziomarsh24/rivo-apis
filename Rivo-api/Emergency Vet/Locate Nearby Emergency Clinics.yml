info:
  name: Locate Nearby Emergency Clinics
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/v1/emergency/clinics?latitude=37.3382&longitude=-121.8863&radius_km=50"
  params:
    - name: latitude
      value: "37.3382"
      type: query
      enabled: true
    - name: longitude
      value: "-121.8863"
      type: query
      enabled: true
    - name: radius_km
      value: "50"
      type: query
      enabled: true
    - name: search
      value: "MedVet"
      type: query
      enabled: false
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Locate Nearby 24/7 Emergency Clinics API

  Searches and locates nearby **24-hour veterinary emergency hospitals**, computed with the **Haversine geodesic formula** and sorted by distance ascending (nearest first), supporting direct call hotlines and Google Maps navigation.

  ## Figma Action
  - **Trigger:** Tapping `📍 Locate Emergency Clinic` button from Emergency Mode screen.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/emergency/clinics`
  - **Authentication:** `Bearer {{userToken}}`

  ### Query Parameters (GUI Checkboxes)
  | Parameter | Type | Required | Default | Description |
  | :--- | :--- | :--- | :--- | :--- |
  | `latitude` | float | Optional | - | User GPS latitude (e.g. `37.3382`) |
  | `longitude` | float | Optional | - | User GPS longitude (e.g. `-121.8863`) |
  | `radius_km` | float | Optional | `50` | Maximum search radius in kilometers |
  | `search` | string | Optional | - | Filter clinics by name, city, or address |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Emergency clinics retrieved successfully",
    "data": [
      {
        "id": 2,
        "name": "MedVet Silicon Valley (24-Hour Emergency Hospital)",
        "slug": "medvet-silicon-valley-24-hour",
        "phone_number": "+1 (408) 649-7070",
        "emergency_hotline": "+1 (408) 649-7070",
        "email": "contact.sv@medvet.com",
        "address": {
          "street": "2101 S 10th St",
          "city": "San Jose",
          "state": "CA",
          "zip_code": "95112",
          "formatted": "2101 S 10th St, San Jose, CA 95112"
        },
        "coordinates": {
          "latitude": 37.3142,
          "longitude": -121.8621
        },
        "distance_km": 3.4,
        "distance_formatted": "3.4 km away",
        "is_open_24_7": true,
        "open_hours_text": "Open 24/7 • Trauma Team on Duty",
        "rating": 4.8,
        "reviews_count": 340,
        "services": [
          "24/7 Emergency Response",
          "Trauma Resuscitation",
          "Orthopedic & Soft Tissue Surgery",
          "CT Scan & Rapid Diagnostics",
