docs: |-
  # Delete Appointment

  Deletes an existing pet appointment and clears associated caches.

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/appointments/:appointmentId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `appointmentId` | integer | Yes | ID of the appointment to delete |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Appointment deleted successfully",
    "data": []
  }
  ```
