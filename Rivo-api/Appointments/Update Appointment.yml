docs: |-
  # Update Existing Appointment

  Updates the details of an existing pet appointment.

  ---

  ## Request Details
  - **Method:** `PUT` / `PATCH`
  - **URL:** `{{base_url}}/v1/appointments/:appointmentId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `appointmentId` | integer | Yes | ID of the appointment to update |

  ### Body Parameters (JSON)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `title` | string | No | Appointment title / summary |
  | `type` | string | No | Type of appointment (e.g. `vet_visit`, `grooming`, `vaccination`) |
  | `vet_name` | string | No | Veterinarian or specialist name |
  | `location` | string | No | Clinic or location address |
  | `latitude` | numeric | No | Location latitude (-90 to 90) |
  | `longitude` | numeric | No | Location longitude (-180 to 180) |
  | `datetime` | string | No | Appointment scheduled date/time (`YYYY-MM-DD HH:mm:ss`) |
  | `reminder` | string | No | Reminder notification window (`1_hour`, `1_day`, `1_week`, `none`) |
  | `notes` | string | No | Optional notes or instructions |
  | `status` | string | No | Status (`upcoming`, `completed`, `cancelled`) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Appointment updated successfully",
    "data": {
      "id": 1,
      "user_id": 1,
      "pet_id": 1,
      "title": "Annual Vet Checkup (Rescheduled)",
      "type": "vet_visit",
      "vet_name": "Dr. Sarah Chen",
      "location": "Happy Paws Veterinary Clinic, Suite 200",
      "datetime": "2026-09-22T11:30:00.000000Z",
      "reminder": "1_day",
      "status": "upcoming"
    }
  }
  ```
