info:
  name: Get All Pet Streaks
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/streaks"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Get All Pet Streaks API

  Retrieves the complete streak status across all 3 key activities (**Training**, **Walk**, and **Care**) along with 7-day visual consistency trackers, perfectly matching Figma's Homepage Streak Modals (`homepage_cluster.png`).

  ## Figma Screens
  - **Screen:** `Homepage` -> Streak Details Modals
  - **Modals:**
    1. **Training Streak Modal:**
       - Current Streak: `3 days` (star icon)
       - Best Streak: `9 days` (trophy icon)
       - Last completed date: `Jul 21` / `Oct 31`
       - Last 7 Days Tracker: `[M, T, W, T, F, S, S]` with completion status
       - Status Message: `Completed today - streak continues!`
    2. **Walk Streak Modal:**
       - Current Streak: `5 days` (flame icon)
       - Best Streak: `14 days` (trophy icon)
       - Last 7 Days Tracker
       - Status Message: `Completed today - streak continues!`
    3. **Care Streak Modal:**
       - Current Streak: `7 days` (heart icon)
       - Best Streak: `21 days` (trophy icon)
       - Last 7 Days Tracker
       - Status Message: `Completed today - streak continues!`

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/pets/:petId/streaks`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Active pet ID (e.g. `1` for Pedro) |

  ---

