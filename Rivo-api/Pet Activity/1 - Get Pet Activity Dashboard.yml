info:
  name: Get Pet Activity Dashboard
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/activity-dashboard"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Get Pet Activity Dashboard API

  Retrieves the unified **Activity & Gamification Dashboard** for the active pet, perfectly matching Figma Screen 5 (`Activity`). Powered by `PetActivityService` and `thekaziomar/laravel-atomic-cache` (v1.5.0).

  ## Figma Screen
  - **Screen:** `Activity` (Figma Frame: Marketplace / Activity Cluster)
  - **UI Elements:**
    - **Pet Level Card:** Displays current pet level (e.g. `Level 3`), teal hexagonal badge, total XP, and progress bar with next milestone target (`70 to Level 4`).
    - **Rank Card:** Current rank tier (e.g. `Rank Gold III`), golden trophy badge, Training Points progress bar (`70 to Gold II | 700/770 TP`).
    - **3 Metric Summary Cards:**
      - 🐾 **Walk Activity:** Total distance this week (e.g. `12.4 km`), count subtitle (`4 walks this week`).
      - 📘 **Training Lessons:** Completed training sessions count (e.g. `3 sessions`), TP gained subtitle (`+120 TP gained`).
      - ❤️ **Care Tasks:** Completed care tasks count (e.g. `32 completed`), XP gained subtitle (`+280 XP gained`).
    - **Today's Activity Unified Timeline:** Real-time chronological timeline merging all daily logs (Care, Walk, Training) sorted latest first with human-readable relative time (`Just now`, `2 hours ago`, `4 hours ago`).
    - **Streaks Summary:** Quick snapshot of consecutive streak days for Walk, Training, and Care.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/pets/:petId/activity-dashboard`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Active pet ID (e.g. `1` for Pedro) |

  ---

